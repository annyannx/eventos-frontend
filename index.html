<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eventos Acadêmicos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Eventos Acadêmicos</h1>

    <form id="form-evento">
      <input type="text" id="titulo" placeholder="Título" maxlength="150" required>
      <textarea id="descricao" placeholder="Descrição"></textarea>
      <input type="text" id="data_evento" placeholder="Data (dd/mm/aaaa)" maxlength="10" required>
      <input type="text" id="local" placeholder="Local" maxlength="100" required>
      <button type="submit">Cadastrar evento</button>
    </form>

    <p id="mensagem"></p>

    <h2>Eventos cadastrados</h2>
    <div id="lista-eventos"></div>
  </main>
  <script src="script.js"></script>
</body>
</html>
